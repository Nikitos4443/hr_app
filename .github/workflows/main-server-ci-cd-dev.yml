name:
  Main Server CI

on:
  push:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'client/**'
      - 'deploy/**'
      - 'infra/lib/main-server-stack.ts'
      - 'infra/constants.ts'
      - 'uv.lock'
      - 'pyproject.toml'
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: main-server-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      BUCKET: hr-app-media-${{ secrets.AWS_ACCOUNT_ID }}-eu-central-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            client/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Install infra dependencies
        run: |
          cd infra
          npm ci

      - name: Deploy CDK Stack
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEPLOY_STACKS: MainServerStack
        run: |
          cd infra
          npx cdk deploy MainServerStack --require-approval never --outputs-file ../cdk-outputs.json

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build-only

      - name: Package release
        run: |
          mkdir -p release/app
          cp -r server shared pyproject.toml uv.lock .python-version release/app/
          for member in analyzer_lambda resume_process_lambda video_process_lambda; do
            mkdir -p "release/app/$member"
            cp "$member/pyproject.toml" "release/app/$member/"
          done
          cp -r client/dist release/client
          cp deploy/deploy-main-server.sh deploy/Caddyfile deploy/*.service release/
          tar -czf release.tar.gz -C release .

      - name: Upload release to S3
        run: |
          aws s3 cp release.tar.gz "s3://$BUCKET/deploy/main-server/${{ github.sha }}.tar.gz"

      - name: Deploy release to EC2 via SSM
        run: |
          INSTANCE_ID=$(jq -r '.MainServerStack.MainServerInstanceId' cdk-outputs.json)
          # Fresh instances need a moment before the SSM agent registers
          aws ssm wait instance-information-available --filters "Key=InstanceIds,Values=$INSTANCE_ID" 2>/dev/null || true

          CMD="set -e; D=\$(mktemp -d); aws s3 cp s3://$BUCKET/deploy/main-server/${{ github.sha }}.tar.gz \$D/r.tgz --region $AWS_REGION; tar -xzf \$D/r.tgz -C \$D; bash \$D/deploy-main-server.sh \$D $AWS_REGION; rm -rf \$D"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -n --arg c "$CMD" '{commands: [$c]}')" \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || STATUS=failed
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output text
          [ "${STATUS:-}" != failed ]
